name: Screenshots

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Get dependencies
        run: flutter pub get

      - name: Write config
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "$CONFIG_JSON" > config.json
          else
            cp config.dev.json config.json
          fi

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google_apis-x86_64-pixel_7

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created emulator snapshot"

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ github.event.release.tag_name || github.run_number }}
          path: build/screenshots
          retention-days: 30

      - uses: actions/checkout@v7
        with:
          ref: main
          path: app-main

      - uses: actions/checkout@v7
        with:
          repository: patri9ck/journai-server
          ref: main
          path: server-main
          token: ${{ secrets.SERVER_REPO_TOKEN }}

      - name: Commit the screenshots to the app and the website
        run: |
          commit() {
            git -C "$1" config user.name "github-actions[bot]"
            git -C "$1" config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git -C "$1" add -A "$2"

            if git -C "$1" diff --cached --quiet; then
              echo "No screenshot changes in $1"
            else
              git -C "$1" commit -m "Update screenshots for ${{ github.event.release.tag_name || github.run_number }}"
              git -C "$1" push
            fi
          }

          for locale_dir in build/screenshots/fastlane/*/; do
            target="app-main/fastlane/metadata/android/$(basename "$locale_dir")"
            rm -rf "$target/images"
            mkdir -p "$target"
            cp -r "$locale_dir/images" "$target/images"
          done

          rm -rf server-main/src/main/resources/static/screenshots
          cp -r build/screenshots/website server-main/src/main/resources/static/screenshots

          commit app-main fastlane/metadata/android
          commit server-main src/main/resources/static/screenshots
