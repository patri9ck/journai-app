name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Write config
        run: cp config.dev.json config.json

      - name: Check license headers
        run: |
          missing=$(git ls-files '*.dart' '*.kt' '*.kts' '*.swift' '*.sh' | xargs grep -L 'SPDX-License-Identifier: GPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then
            echo "Missing license header:"
            echo "$missing"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Write config
        run: cp config.dev.json config.json

      - name: Build APK
        run: flutter build apk --debug --target=integration_test/app_test.dart --dart-define=BASE_URL=http://127.0.0.1:9/

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google_apis-x86_64-pixel_7

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created emulator snapshot"

      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/app_test.dart --dart-define=BASE_URL=http://127.0.0.1:9/
