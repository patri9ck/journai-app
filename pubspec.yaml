name: journai_app
description: "Journai App"
publish_to: 'none'
version: 0.0.1+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_sign_in: ^7.2.0
  http: ^1.6.0
  cryptography_plus: ^3.0.0
  cryptography_flutter_plus: ^3.0.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.1.0
  google_fonts: ^9.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  google_mlkit_translation: ^0.15.1
  package_info_plus: ^10.1.0
  share_plus: ^13.0.0
  flutter_local_notifications: ^22.0.0
  path_provider: ^2.1.0
  flutter_timezone: ^5.0.0
  timezone: ^0.11.0
  purchases_flutter: ^10.18.1
  home_widget: ^0.10.0
  dynamic_color: ^2.1.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  geolocator_platform_interface: any
  plugin_platform_interface: any
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/google_fonts/
